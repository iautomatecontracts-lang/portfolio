<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Void Warrant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Jost:wght@400;500;600;700&family=Special+Elite&family=Yellowtail&display=swap">
<style>
/* Layout: a pulp-magazine desk in deep space. Dark console panels hold the fight; cards, warrants and dossiers are printed matter in cream paper and black ink. */
:root{
  --ink:#17132c; --void:#0c0d2b; --hull:#14163f; --panel:#1b1e52; --panel2:#272b6b; --line:#434c9c;
  --text:#f6ecd2; --dim:#aeabd0;
  --paper:#f4e7c3; --paperdim:#5b5470;
  --red:#e8472e; --amber:#f8c33c; --teal:#3cc0b0; --violet:#b39df0; --green:#8fd16a;
  --kinetic:#e3b27a; --energy:#f8d648; --plasma:#f2693f; --shock:#63c5ea;
  --w:#c2331c; --g:#0b6f65; --i:#553ab3;
  --f-display:'Bowlby One','Arial Black',Impact,sans-serif;
  --f-script:'Yellowtail','Brush Script MT',cursive;
  --f-body:'Jost','Century Gothic',Futura,'Trebuchet MS',sans-serif;
  --f-mono:'Special Elite','Courier New',monospace;
  --hard:4px 4px 0 rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-body);font-size:15.5px;line-height:1.42}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.06;letter-spacing:.01em}
h3{font-family:var(--f-body);font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;text-wrap:balance}
p{margin:0}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.script{font-family:var(--f-script);font-weight:400;letter-spacing:0;text-transform:none}
.script.big{font-size:36px;color:var(--amber);transform:rotate(-2deg);transform-origin:left;display:inline-block;line-height:1;text-shadow:2px 2px 0 var(--ink)}
.amber{color:var(--amber)} .dimtx{color:var(--dim)}
.kw{color:var(--amber);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.paper{background-color:var(--paper);background-image:radial-gradient(rgba(23,19,44,.1) 1px,transparent 1.3px);background-size:5px 5px;color:var(--ink);border:2px solid var(--ink)}
.paper .eyebrow,.paper .dimtx{color:var(--paperdim)}
.paper .kw{color:var(--w)}

.btn{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 18px;border-radius:6px;font-family:var(--f-body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.55);transition:transform .1s,box-shadow .1s,background .15s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(0,0,0,.55);background:#fff7de}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.55)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber)}
.btn.primary:hover:not(:disabled){background:#ffd562}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--panel2);border-color:var(--amber);box-shadow:none;transform:none}
.btn.sm{padding:6px 12px;font-size:12px}

.panel{background:linear-gradient(180deg,var(--panel),var(--hull));border:2px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--hard)}
.bar{position:relative;height:12px;background:var(--ink);border:2px solid var(--text);border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);transition:width .3s}
.bar.rep{border-color:var(--ink);background:#fff7de}
.bar.rep>i{background:var(--red)}
.bar .cap{position:absolute;top:0;bottom:0;width:3px;background:var(--teal)}
.pt{flex:0 0 auto;display:block;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.dtp{display:inline-block;font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1.5px solid var(--ink);border-radius:3px;color:var(--ink);line-height:1.35;white-space:nowrap}

/* ---------- title: magazine cover + guild ledger ---------- */
.title{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:30px;align-items:start;padding-block:10px 20px}
.cover{border:3px solid var(--ink);outline:3px solid var(--paper);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;box-shadow:9px 9px 0 rgba(0,0,0,.45);min-width:0;background:var(--hull);margin:3px}
.mast{position:relative;background-color:var(--red);background-image:radial-gradient(rgba(23,19,44,.2) 1px,transparent 1.3px);background-size:5px 5px;padding:18px 22px 26px;border-bottom:3px solid var(--ink)}
.mast .script{font-size:clamp(20px,2.8vw,28px);color:var(--paper);display:block;transform:rotate(-3deg);transform-origin:left;text-shadow:2px 2px 0 var(--ink)}
.mast h1{font-size:clamp(46px,8.4vw,96px);line-height:.92;text-transform:uppercase;color:var(--amber);transform:rotate(-3deg);transform-origin:left center;margin-top:6px;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),4px 4px 0 var(--ink),6px 6px 0 var(--ink),8px 8px 0 var(--ink)}
.mast .burst{position:absolute;right:12px;top:10px;width:108px;height:108px;transform:rotate(12deg)}
.cover .scene{display:block;width:100%;height:clamp(170px,24vw,260px);border-bottom:3px solid var(--ink)}
.cover .strip{padding:16px 22px 22px;display:flex;flex-direction:column;gap:14px}
.lede{max-width:56ch;font-size:16.5px}
.ledger{padding:20px;border-radius:3px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-mono);box-shadow:7px 7px 0 rgba(0,0,0,.45);transform:rotate(.7deg);margin-top:10px}
.ledger h2{font-size:30px;color:var(--w)}
.repline span{color:var(--paperdim)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--f-display);font-weight:400;font-size:22px}
.facts span{font-size:12px;color:var(--paperdim);line-height:1.25}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ranks li{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:6px 8px 4px;border-top:1px dashed currentColor;align-items:baseline}
.ranks li.me{background:var(--amber);color:var(--ink)}
.panel .ranks li.me{border-radius:3px}

/* ---------- hunter select ---------- */
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.shead h2{font-size:32px;color:var(--amber);text-shadow:3px 3px 0 var(--ink)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.hcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard.locked{opacity:.6}
.hcard .pt,.fhead .pt{box-shadow:0 0 0 2px var(--paper)}
.hcard h3{font-size:20px}
.alias{font-family:var(--f-script);font-size:20px;color:var(--amber);line-height:1.05}
.hcard p{color:var(--dim);font-size:14.5px}
.kv{display:flex;gap:18px;margin:0}
.kv div{display:flex;flex-direction:column}
.kv dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kv dd{margin:0;font-weight:600}
.gearbox{border:2px dashed var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.gearbox b{color:var(--teal);text-transform:uppercase;letter-spacing:.04em;font-size:13px}
.deckline{font-size:13px;color:var(--dim);flex:1}

/* ---------- HUD ---------- */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 14px;background:var(--hull);border:2px solid var(--line);border-radius:10px;margin-bottom:18px;box-shadow:var(--hard)}
.hud .who{display:flex;gap:10px;align-items:center;min-width:0}
.hud .who .pt{border-radius:50%;box-shadow:0 0 0 2px var(--paper)}
.hud .hn{font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.hud .hs{font-family:var(--f-script);font-size:16px;color:var(--amber);line-height:1}
.hud .hpbox{display:flex;flex-direction:column;gap:3px;min-width:120px;flex:1 1 120px;max-width:220px}
.hud .hpbox .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
.hud .stat{display:flex;flex-direction:column;line-height:1.15}
.hud .stat b,.hud .hpbox b{font-family:var(--f-mono);font-weight:400;font-size:16px}
.hud .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.hud .gear{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 160px;min-width:0}
.hud .acts{display:flex;gap:8px;margin-left:auto}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:1px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.g{border-color:var(--teal);color:var(--teal)}
.chip.s-exposed,.chip.s-burn{border-color:var(--plasma);color:var(--plasma)}
.chip.s-jammed{border-color:var(--shock);color:var(--shock)}
.chip.s-marked{border-color:var(--violet);color:var(--violet)}
.chip.s-rage{border-color:var(--red);color:#ff8a76}
.chip.s-cloaked,.chip.s-stun{border-color:var(--dim);color:var(--text)}
.chip.inst{border-color:var(--teal);color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}

/* ---------- bounty board ---------- */
.sector{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sector h2{font-size:32px;color:var(--amber);text-shadow:3px 3px 0 var(--ink)}
.sector p{color:var(--dim);max-width:65ch}
.track{display:flex;gap:6px;align-items:center;margin-top:6px}
.track i{width:34px;height:8px;background:var(--line);border-radius:4px}
.track i.done{background:var(--amber)} .track i.now{background:var(--text)} .track i.boss{width:46px;background:rgba(232,71,46,.45)} .track i.boss.now{background:var(--red)}
.notice{border-left:4px solid var(--teal);background:rgba(60,192,176,.1);padding:8px 12px;margin-bottom:14px;font-size:14.5px;border-radius:0 6px 6px 0}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px 20px;padding:10px 4px 4px}
.poster{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;border-radius:3px;box-shadow:5px 5px 0 rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s;min-width:0;font-family:var(--f-body)}
.poster span{display:block}
.poster:nth-child(3n+1){transform:rotate(-1.2deg)} .poster:nth-child(3n+2){transform:rotate(.8deg)} .poster:nth-child(3n){transform:rotate(-.5deg)}
.poster:hover{transform:rotate(0deg) translateY(-5px);box-shadow:8px 9px 0 rgba(0,0,0,.45)}
.poster::before{content:"";position:absolute;left:50%;top:-8px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--red);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.poster .ph{text-align:center;padding:16px 10px 2px;font-family:var(--f-display);font-size:36px;line-height:1;color:var(--w);text-transform:uppercase;letter-spacing:.04em}
.poster .terms{text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-block:2px solid var(--ink);margin:6px 14px 0;padding:4px 0 1px}
.poster .pb{display:flex;flex-direction:column;gap:8px;padding:12px 14px 14px;flex:1}
.poster .mug{align-self:center}
.poster .pn{font-family:var(--f-display);font-size:19px;line-height:1.08;text-align:center}
.poster .pa{font-family:var(--f-script);font-size:20px;text-align:center;color:var(--w);line-height:1}
.poster .pc{font-family:var(--f-mono);font-size:12.5px;line-height:1.35;flex:1;text-align:center}
.poster .rew{font-family:var(--f-display);font-size:21px;text-align:center;background:var(--amber);border:2px solid var(--ink);padding:5px 6px 3px;transform:rotate(-1.5deg);line-height:1.1}
.poster .prow{display:flex;justify-content:space-between;border-top:1px dashed rgba(23,19,44,.55);padding-top:5px;font-size:13px;gap:8px;font-family:var(--f-mono)}
.poster .prow b{font-weight:400}
.poster.k-elite{background-color:#f5c9b4} .poster.k-elite .ph{font-size:24px;color:var(--ink)}
.poster.k-boss{background-color:#f8d774;grid-column:1/-1;max-width:420px;justify-self:center;width:100%} .poster.k-boss .ph{font-size:30px}
.poster.k-shop,.poster.k-dock,.poster.k-contact{background-color:#cfece4}
.poster.k-shop .ph,.poster.k-dock .ph,.poster.k-contact .ph{font-size:24px;color:var(--g)}
.nart svg,.card .art svg{display:block;width:100%;height:auto}
.nart{border:2px solid var(--ink);border-radius:3px;overflow:hidden}

/* ---------- combat ---------- */
.arena{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;align-items:start}
.me,.foe{display:flex;flex-direction:column;gap:10px;min-width:0}
.foe{border-color:var(--amber)}
.foe.elite{border-color:var(--red)} .foe.boss{border-color:var(--text)}
.fhead{display:flex;gap:14px;align-items:center;min-width:0}
.fhead h2{font-size:25px} .fhead h3{font-size:19px}
.hpw{display:flex;flex-direction:column;gap:4px}
.hpn{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--f-mono);font-size:14px}
.hpn b{font-size:19px;font-weight:400}
.shv{display:inline-flex;gap:4px;align-items:center;color:var(--teal);font-size:17px}
.shv svg,.ic svg,.intent>svg{width:16px;height:16px}
.bar.big{height:16px}
.intent{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:7px 11px;border:2px solid var(--ink);border-radius:4px;background:var(--amber);color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.intent .ilbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}
.intent b{font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.intent .dimtx{color:var(--ink);opacity:.75}
.ics{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.ic{display:inline-flex;gap:4px;align-items:center;font-family:var(--f-mono);font-size:16px;line-height:1}
.ic.atk{color:#a31d0e} .ic.sh{color:#07564e} .ic.bf{color:var(--ink)} .ic.db{color:#45309a} .ic.hl{color:#1b6a2e} .ic.ck{color:var(--ink)}
.dossier{margin:0;display:grid;gap:6px;padding:10px 12px 8px;font-family:var(--f-mono);font-size:13px;border-radius:3px;line-height:1.35}
.dossier div{display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px}
.dossier dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paperdim);padding-top:1px}
.dossier dd{margin:0}
.unk{color:var(--paperdim)}
.log{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:1px;border-top:2px dashed var(--line);padding-top:8px;min-height:60px;font-family:var(--f-mono)}
.log span:last-child{color:var(--text)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.energy{display:flex;align-items:baseline;gap:2px;border:2px solid var(--ink);border-radius:50px;padding:3px 16px 2px;background:var(--amber);color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.5);font-family:var(--f-mono)}
.energy b{font-family:var(--f-display);font-weight:400;font-size:24px} .energy small{margin-left:8px;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.ctrl .turn{color:var(--dim);font-size:13px;margin-left:auto;font-family:var(--f-mono)}
.hand{display:flex;gap:14px;justify-content:safe center;overflow-x:auto;padding:18px 12px 12px;margin-top:2px;min-height:262px}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin-top:4px}

/* ---------- cards ---------- */
.card{--tc:var(--w);position:relative;flex:0 0 auto;width:152px;min-height:226px;border-radius:8px;background-color:var(--paper);background-image:radial-gradient(rgba(23,19,44,.09) 1px,transparent 1.3px);background-size:5px 5px;border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px;padding:9px 9px 10px;text-align:left;color:var(--ink);font:inherit;transition:transform .15s,box-shadow .15s}
.card span{display:block}
button.card{cursor:pointer}
.card.t-gadget{--tc:var(--g)} .card.t-intel{--tc:var(--i)}
button.card:hover:not(:disabled){transform:translateY(-10px) rotate(-1deg);box-shadow:6px 8px 0 rgba(0,0,0,.5)}
button.card:disabled{filter:grayscale(.75) brightness(.72);cursor:not-allowed}
.card .cost{position:absolute;top:-11px;left:-9px;width:32px;height:32px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;line-height:1;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.card .nm{font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:12.5px;line-height:1.12;padding-left:22px;min-height:28px;display:flex;align-items:center}
.card.up .nm{color:#1b6a2e}
.card .art{border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--ink)}
.card .tp{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tc);font-weight:700;border-bottom:2px solid var(--tc);padding-bottom:4px}
.card .ds{font-size:13px;line-height:1.28;flex:1}
.card .kw{color:var(--w)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;min-height:12px}
.card .foot .dimtx{color:var(--paperdim)}
.card .rar{width:8px;height:8px;border-radius:50%;background:rgba(23,19,44,.25);margin-left:auto}
.card .rar.r-uncommon{background:var(--teal);box-shadow:0 0 0 1.5px var(--ink)} .card .rar.r-rare{background:var(--red);box-shadow:0 0 0 1.5px var(--ink)}
.card .price{font-family:var(--f-display);color:var(--w);font-size:14px}
.card .wk{background:var(--green);border:1.5px solid var(--ink);padding:0 6px;border-radius:3px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.card.ready{box-shadow:0 0 0 3px var(--teal),0 0 22px rgba(60,192,176,.7)}
.card.sold{opacity:.35}
.cgrid{display:flex;flex-wrap:wrap;gap:20px 16px;padding-top:12px}

/* ---------- centered screens ---------- */
.mid{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mid h2{font-size:28px}
.mid p{max-width:65ch}
.earn{display:flex;gap:28px;flex-wrap:wrap}
.earn div{display:flex;flex-direction:column}
.earn b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.earn span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.notes{margin:0;padding-left:18px;color:var(--dim);font-size:14.5px}
.choices{display:grid;gap:10px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .1s}
.choice:hover:not(:disabled){border-color:var(--amber);transform:translate(-1px,-1px)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice b{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px}

let S=null, busy=false, modal=null;
const fxQ=[];
const KEY='voidwarrant.v1';
function fresh(){return {screen:'title',career:{rep:0,runs:0,wins:0,best:0},run:null,combat:null,reward:null,shop:null,event:null,pick:null,end:null,resume:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.career?s:null}catch(e){return null}}
const C=()=>S&&S.combat;
const hasGear=id=>!!(S.run&&S.run.gear.includes(id));
function rankOf(rep){let i=0;for(let k=0;k<RANKS.length;k++)if(rep>=RANKS[k][0])i=k;return {i,name:RANKS[i][1],floor:RANKS[i][0],next:RANKS[i+1]||null}}

/* ================= RUN ================= */
function newRun(hid){
  const h=HUNTERS[hid];
  S.run={hunter:hid,hp:h.hp,maxHp:h.hp,credits:50,rep:0,deck:h.deck.map(id=>mk(id)),gear:[h.gear],sector:0,floor:0,nodes:[],caught:[],seen:[],notice:null};
  S.combat=S.reward=S.shop=S.event=S.pick=S.end=null;
  genFloor();S.screen='board';render();
}
function wpick(w){const tot=w.reduce((a,x)=>a+x[1],0);let r=Math.random()*tot;for(const [k,v] of w){if((r-=v)<0)return k}return w[0][0]}
function genFloor(){
  const r=S.run,sec=SECTORS[r.sector];
  if(r.floor===5){r.nodes=[{type:'boss',bid:sec.boss}];return}
  const used=[];
  const nb=()=>{let o=sec.pool.filter(b=>!r.caught.includes(b)&&!used.includes(b));if(!o.length)o=sec.pool.filter(b=>!used.includes(b));const b=pick(o);used.push(b);return b};
  let types;
  if(r.floor===0)types=['bounty','bounty','bounty'];
  else{
    types=[];const eliteOk=r.floor>=2&&!r.caught.includes(sec.elite);
    const w=[['bounty',44],['elite',eliteOk?17:0],['shop',13],['dock',13],['contact',14]];
    while(types.length<3){const t=wpick(w);if(t!=='bounty'&&types.includes(t))continue;types.push(t)}
    if(r.floor===4&&!types.includes('dock'))types[2]='dock';
    if(!types.some(t=>t==='bounty'||t==='elite'))types[0]='bounty';
  }
  r.nodes=types.map(t=>t==='bounty'?{type:t,bid:nb()}:t==='elite'?{type:t,bid:sec.elite}:{type:t});
}
function enterNode(i){
  const n=S.run.nodes[i];if(!n)return;
  S.run.notice=null;
  if(n.bid){startCombat(n.bid,n.type);return}
  if(n.type==='shop'){genShop();S.screen='shop'}
  else if(n.type==='dock')S.screen='dock';
  else{
    let o=EVENTS.filter(e=>!S.run.seen.includes(e.id));if(!o.length){S.run.seen=[];o=EVENTS}
    const e=pick(o);S.run.seen.push(e.id);S.event={id:e.id,result:null};S.screen='event';
  }
  render();
}
function afterNode(){
  const r=S.run;S.reward=S.shop=S.event=S.pick=null;
  r.floor++;r.notice=null;
  if(r.floor>5){
    r.sector++;r.floor=0;
    if(r.sector>2){endRun(true);return}
    const heal=Math.round((r.maxHp-r.hp)*.6);r.hp+=heal;
    r.notice=`Jumped to ${SECTORS[r.sector].n}. Your ship's medbay restored ${heal} Hull on the way.`;
  }
  genFloor();S.screen='board';render();
}
function addCard(id,up=false){S.run.deck.push(mk(id,up))}
function hurt(n){S.run.hp=Math.max(1,S.run.hp-n)}
function healP(n){const r=S.run,b=r.hp;r.hp=Math.min(r.maxHp,r.hp+n);if(C()&&r.hp>b)fl('me','+'+(r.hp-b),'f-heal')}
function rollCards(kind,n=3){
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].r!=='starter');
  const w=kind==='bounty'?[60,32]:[35,40];const out=[];let g=0;
  while(out.length<n&&g++<300){const x=Math.random()*100;const r=x<w[0]?'common':x<w[0]+w[1]?'uncommon':'rare';const o=pool.filter(k=>CARDS[k].r===r&&!out.includes(k));if(o.length)out.push(pick(o))}
  return out;
}
function rollGear(){const o=Object.keys(GEAR).filter(g=>!GEAR[g].start&&!S.run.gear.includes(g));return o.length?pick(o):null}
function genShop(){
  const ids=[];
  for(const t of ['weapon','weapon','gadget','intel',null]){const o=Object.keys(CARDS).filter(k=>CARDS[k].r!=='starter'&&(!t||CARDS[k].t===t)&&!ids.includes(k));ids.push(pick(o))}
  const price=id=>({common:48,uncommon:76,rare:130}[CARDS[id].r])+rnd(13)-6;
  const gear=shuffle(Object.keys(GEAR).filter(g=>!GEAR[g].start&&!S.run.gear.includes(g))).slice(0,2);
  S.shop={cards:ids.map(id=>({id,price:price(id),sold:false})),gear:gear.map(id=>({id,price:140+rnd(40),sold:false})),removed:false,repaired:false};
}
function endRun(won){
  const r=S.run,c=S.career;const rep=Math.max(0,r.rep);const before=c.rep;
  c.rep+=rep;c.runs++;if(won)c.wins++;c.best=Math.max(c.best,rep);
  S.end={won,hunter:r.hunter,rep,before,after:c.rep,credits:r.credits,caught:r.caught.slice(),sector:r.sector,killer:S.combat?S.combat.enemy.id:null};
  S.run=S.combat=S.reward=S.shop=S.event=S.pick=S.resume=null;
  S.screen='end';busy=false;modal=null;render();
}

/* ================= COMBAT ================= */
function log(s){const c=C();if(!c)return;c.log.push(s);if(c.log.length>5)c.log.shift()}
function startCombat(bid,kind){
  const b=BOUNTIES[bid];
  S.combat={kind,enemy:{id:bid,hp:b.hp,max:b.hp,shield:b.trait.shield||0,st:{},weak:b.weak,revealed:hasGear('scanner'),idx:0,phase:1},
    p:{shield:0,st:{}},draw:shuffle(S.run.deck.map(c=>({...c}))),hand:[],discard:[],exhaust:[],energy:0,maxE:3,turn:0,wpnTurn:0,intelPlayed:0,installs:{},over:false,result:null,log:[],ctx:{},startHp:S.run.hp,step:'player'};
  S.screen='combat';busy=false;
  startTurn();render();
}
function curMove(){const e=C().enemy,b=BOUNTIES[e.id];const pat=e.phase===2&&b.p2.pat?b.p2.pat:b.pat;return pat[e.idx%pat.length]}
function enemyHit(v){const c=C(),e=c.enemy;let d=v+(e.st.rage||0);if(e.st.jammed)d=Math.floor(d*.75);if(c.p.st.exposed)d=Math.floor(d*1.5);if(hasGear('ablative'))d-=1;return Math.max(0,d)}
function intentDmg(){const c=C();if(!c||c.enemy.st.stun)return 0;let t=0;for(const [k,a,n] of curMove().fx)if(k==='atk')t+=enemyHit(a)*(n||1);return t}
function capPct(up){let p=25+(up?10:0);if(hasGear('restraint'))p+=10;if(hasGear('shackles'))p+=15;if(C()&&C().enemy.revealed)p+=10;return p}
function gainShield(n){const c=C();if(!c||c.over||n<=0)return;c.p.shield+=n;fl('me','+'+n+' Shield','f-shield')}
function install(k,v){const c=C();c.installs[k]=(c.installs[k]||0)+v;fl('me',INSTALLS[k].n+' online','f-shield')}
function reveal(){const e=C().enemy;if(!e.revealed){e.revealed=true;fl('foe','WEAK TO '+DT[e.weak].toUpperCase(),'f-intel')}}
function addE(k,v){const c=C();if(!c||c.over)return;const e=c.enemy;if(k==='burn'&&BOUNTIES[e.id].trait.mech){fl('foe','IMMUNE','f-dim');return}e.st[k]=(e.st[k]||0)+v}
function addP(k,v){const c=C();c.p.st[k]=(c.p.st[k]||0)+v;fl('me',STATUS[k].n+' '+v,'f-dim')}
function decay(st,keys){for(const k of keys)if(st[k]>0)st[k]--}
function draw(n){const c=C();if(!c||c.over)return;for(let i=0;i<n;i++){if(c.hand.length>=10)break;if(!c.draw.length){if(!c.discard.length)break;c.draw=shuffle(c.discard);c.discard=[]}c.hand.push(c.draw.pop())}}
function weaponBonus(){return (C().installs.overclock||0)+(hasGear('stims')?1:0)}
function atk(base,dt,o={}){
  const c=C();if(!c||c.over)return;const e=c.enemy;const n=o.n||1;
  for(let i=0;i<n;i++){
    if(c.over)return;
    let d=base+(o.noBonus?0:weaponBonus());
    if(i===0&&c.ctx.first&&hasGear('holster'))d+=3;
    if(i===0&&!o.noBonus&&!c.ctx.pow){c.ctx.pow=1;const w=POW[dt]||POW.kinetic;pow(w[0],w[1])}
    d+=(e.st.marked||0);
    if(o.mult)d*=o.mult;
    if(c.p.st.jammed)d=Math.floor(d*.75);
    const weak=e.revealed&&dt===e.weak;
    if(weak)d=Math.floor(d*(hasGear('vi')?2:1.5));
    if(e.st.exposed)d=Math.floor(d*1.5);
    if(e.st.cloaked)d=Math.floor(d*.5);
    dmgEnemy(Math.max(0,d),{pierce:o.pierce,weak,dt});
    if(c.over)return;
    if(c.installs.biolock&&!o.noBonus)addE('marked',1);
    if(hasGear('coil')&&dt==='plasma')addE('burn',1);
    const th=BOUNTIES[e.id].trait.thorns;if(th)dmgPlayer(th);
  }
}
function dmgEnemy(d,o={}){
  const c=C(),e=c.enemy;
  if(!o.pierce&&!o.raw&&e.shield>0){const ab=Math.min(e.shield,d);e.shield-=ab;d-=ab;if(ab)fl('foe','blocked '+ab,'f-shield')}
  if(d>0){e.hp-=d;fl('foe','-'+d+(o.weak?' WEAK POINT':''),o.raw?'f-burn':'f-'+(o.dt||'kinetic'));shake('foe')}
  if(e.hp<=0){e.hp=0;win('kill');return}
  const b=BOUNTIES[e.id];
  if(b.p2&&e.phase===1&&e.hp<=e.max*b.p2.at){
    e.phase=2;e.idx=0;
    if(b.p2.weak){e.weak=b.p2.weak;e.revealed=hasGear('scanner')}
    doMove({fx:b.p2.fx||[]});banner(b.p2.msg);log(b.p2.msg+'.');
  }
}
function dmgPlayer(d,o={}){
  const c=C();if(c.over)return;
  if(!o.raw&&c.p.shield>0){const ab=Math.min(c.p.shield,d);c.p.shield-=ab;d-=ab;if(ab)fl('me','blocked '+ab,'f-shield')}
  if(d>0){S.run.hp-=d;fl('me','-'+d,o.raw?'f-burn':'f-hurt');shake('me')}
  if(S.run.hp<=0){S.run.hp=0;lose()}
}
function doMove(m){
  const c=C(),e=c.enemy;
  for(const [k,a,b] of m.fx){
    if(c.over)return;
    if(k==='atk'){for(let i=0;i<(b||1);i++){if(c.over)return;const d=enemyHit(a);if(d>0||c.p.shield>0)dmgPlayer(d);else fl('me','0','f-dim')}}
    else if(k==='shield'){e.shield+=a;fl('foe','+'+a+' Shield','f-shield')}
    else if(k==='rage'){e.st.rage=(e.st.rage||0)+a;fl('foe','Rage +'+a,'f-hurt')}
    else if(k==='apply')addP(a,b);
    else if(k==='heal'){const h=Math.min(a,e.max-e.hp);e.hp+=h;if(h)fl('foe','+'+h,'f-heal')}
    else if(k==='cloak'){e.st.cloaked=2;fl('foe','CLOAKED','f-dim')}
  }
}
function startTurn(){
  const c=C();c.turn++;c.wpnTurn=0;c.step='player';c.p.shield=0;
  if(c.turn===1&&hasGear('boots'))c.p.shield+=8;
  if(hasGear('plating'))c.p.shield+=3;
  if(c.installs.swarm)c.p.shield+=c.installs.swarm;
  if(c.p.st.burn>0){dmgPlayer(c.p.st.burn,{raw:true});c.p.st.burn--;if(c.over)return}
  c.maxE=3+(c.turn===1&&hasGear('cell1')?1:0);c.energy=c.maxE;
  draw(5+(c.turn===1&&hasGear('extmag')?2:0));
}
const costOf=inst=>{const c=CARDS[inst.id].c;return typeof c==='function'?c(inst.up):c};
function playCard(i){
  const c=C();if(!c||busy||c.over||modal||S.pick)return;
  const inst=c.hand[i];if(!inst)return;const def=CARDS[inst.id],cost=costOf(inst);
  if(cost>c.energy){toast('Not enough Energy for '+def.n+'.');return}
  c.energy-=cost;c.hand.splice(i,1);
  c.ctx={first:def.t==='weapon'&&c.wpnTurn===0};
  log('You play '+def.n+(inst.up?'+':'')+'.');
  def.p(inst.up);
  c.ctx={};
  if(def.t==='weapon')c.wpnTurn++;
  if(def.t==='intel'){c.intelPlayed++;if(hasGear('uplink'))addE('marked',2)}
  if(!c.over)(def.ex?c.exhaust:c.discard).push(inst);
  render();
}
function endTurn(){
  const c=C();if(!c||busy||c.over||modal||S.pick)return;
  busy=true;
  if(c.installs.drone){atk(c.installs.drone,'energy',{noBonus:true});if(c.over){render();return}}
  c.discard.push(...c.hand);c.hand=[];
  decay(c.p.st,['exposed','jammed']);
  c.step='enemy';render();
  setTimeout(enemyTurn,520);
}
function enemyTurn(){
  const c=C();if(!c||c.over||c.step!=='enemy')return;
  const e=c.enemy,b=BOUNTIES[e.id];
  e.shield=0;
  if(e.st.burn>0){dmgEnemy(e.st.burn,{raw:true});e.st.burn--;if(c.over){render();return}}
  if(e.st.stun){e.st.stun=0;log(b.n+' is stunned and loses the turn.')}
  else{const m=curMove();log(b.n+' uses '+m.n+'.');doMove(m);e.idx++}
  if(c.over){render();return}
  if(b.trait.regen&&e.hp<e.max){const h=Math.min(b.trait.regen,e.max-e.hp);e.hp+=h;fl('foe','+'+h,'f-heal')}
  decay(e.st,['exposed','jammed','marked','cloaked']);
  c.step='enemyDone';render();
  setTimeout(()=>{const c2=C();if(!c2||c2.over||c2.step!=='enemyDone')return;startTurn();if(!c2.over)busy=false;render()},560);
}
function win(how){const c=C();if(c.over)return;c.over=true;c.result=how;busy=true;if(how==='capture')pow('GOTCHA!',K.teal);banner(how==='capture'?'Captured alive':'Target down','good');setTimeout(()=>{if(C()&&C().over)finishCombat()},1150)}
function lose(){const c=C();if(c.over)return;c.over=true;c.result='dead';busy=true;banner('Hull breach','bad');setTimeout(()=>{if(C()&&C().over)endRun(false)},1400)}
function finishCombat(){
  const c=C(),b=BOUNTIES[c.enemy.id],r=S.run;busy=false;
  if(c.result==='dead'){endRun(false);return}
  const captured=c.result==='capture';let cr=b.reward,rp=b.rep;const notes=[];
  if(b.terms==='ALIVE'){if(captured){cr*=1.5;rp*=1.5;notes.push('Delivered alive as the client asked: pay and reputation up 50%.')}else{cr*=.5;rp*=.5;notes.push('The client wanted this one alive. Half pay, half reputation.')}}
  else if(captured){cr*=1.3;rp*=1.5;notes.push('Live capture bonus: +30% credits, +50% reputation.')}
  if(captured&&hasGear('shackles')){cr*=1.25;notes.push('Warden Shackles: +25% credits.')}
  if(hasGear('chip'))cr*=1.25;if(hasGear('badge'))rp*=1.25;
  cr=Math.round(cr);rp=Math.round(rp);
  if(r.hp>=c.startHp){rp+=5;notes.push('Clean job, no Hull lost: +5 reputation.')}
  r.credits+=cr;r.rep+=rp;r.caught.push(c.enemy.id);
  if(hasGear('medkit')){r.hp=Math.min(r.maxHp,r.hp+6);notes.push('Nano-Med Kit restored 6 Hull.')}
  const kind=c.kind,bid=c.enemy.id;S.combat=null;
  if(bid==='eclipse'){r.rep+=300;endRun(true);return}
  let gear=null;if(kind!=='bounty'){gear=rollGear();if(gear)r.gear.push(gear)}
  S.reward={bid,captured,cr,rp,notes,cards:rollCards(kind),taken:null,gear,kind};
  S.screen='reward';render();
}
function resumeCombat(){
  const c=C();if(!c||S.screen!=='combat')return;
  if(c.over){finishCombat();return}
  if(c.step==='enemy'){busy=true;setTimeout(enemyTurn,300)}
  else if(c.step==='enemyDone'){startTurn();busy=false;render()}
}

/* ================= FX ================= */
function fl(t,x,c){fxQ.push({t,x,c})}
function shake(t){fxQ.push({t,k:'shake'})}
function pow(x,c){fxQ.push({t:'foe',k:'pow',x,c})}
function banner(x,c=''){const d=document.createElement('div');d.className='banner '+c;d.textContent=x;$('#fx').appendChild(d);setTimeout(()=>d.remove(),1600)}
function toast(x){const fx=$('#fx');fx.querySelectorAll('.toast').forEach(t=>t.remove());const d=document.createElement('div');d.className='toast';d.textContent=x;fx.appendChild(d);setTimeout(()=>d.remove(),3300)}
function flushFx(){
  const q=fxQ.splice(0);const cnt={};
  for(const f of q){
    const el=document.getElementById(f.t);if(!el)continue;
    if(f.k==='shake'){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');continue}
    const r=el.getBoundingClientRect();
    if(f.k==='pow'){
      const d=document.createElement('div');d.className='pow';
      d.style.left=(r.left+r.width-64)+'px';d.style.top=Math.max(44,r.top+18)+'px';d.style.setProperty('--rot',(rnd(22)-11)+'deg');
      const b=burst(50,50,49,33,13,.2);
      d.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${b}" fill="${K.ink}" transform="translate(3 4)"/><path d="${b}" fill="${f.c}" stroke="${K.ink}" stroke-width="2.4" stroke-linejoin="round"/></svg><b>${f.x}</b>`;
      $('#fx').appendChild(d);setTimeout(()=>d.remove(),850);continue;
    }
    const n=cnt[f.t]=(cnt[f.t]||0)+1;
    const s=document.createElement('div');s.className='float '+f.c;s.textContent=f.x;
    s.style.left=(r.left+r.width/2+((n%3)-1)*70)+'px';
    s.style.top=Math.max(20,r.top+40+((n-1)%6)*24)+'px';
    s.style.animationDelay=(n-1)*80+'ms';
    $('#fx').appendChild(s);setTimeout(()=>s.remove(),1300+n*80);
  }
}

const dtChip=dt=>`<span class="dtp" style="background:var(--${dt})">${DT[dt]}</span>`;

function cardHTML(inst,o={}){
  const d=CARDS[inst.id];const cls=['card','t-'+d.t];if(inst.up)cls.push('up');if(o.ready)cls.push('ready');if(o.sold)cls.push('sold');
  const dtag=d.dt?(d.dt==='adaptive'?'<span class="dtp" style="background:var(--violet)">Adaptive</span>':dtChip(d.dt)):'';
  const tag=o.action?'button':'div';
  const attrs=o.action?` data-a="${o.action}" ${o.data||''}${o.disabled?' disabled':''}`:'';
  return `<${tag} class="${cls.join(' ')}"${attrs}><span class="cost">${costOf(inst)}</span><span class="nm">${d.n}${inst.up?'+':''}</span><span class="art">${cardArt(inst.id)}</span><span class="tp"><span>${TYPEN[d.t]}</span>${dtag}</span><span class="ds">${kw(d.d(inst.up))}</span><span class="foot">${o.price!=null?`<span class="price">${o.sold?'Sold':o.price+' CR'}</span>`:''}${o.weak?'<span class="wk">Weak point</span>':''}${o.key?`<span class="dimtx">Key ${o.key}</span>`:''}<span class="rar r-${d.r}"></span></span></${tag}>`;

function intentHTML(){
  const e=C().enemy;
  if(e.st.stun)return `<div class="intent">${ICON.stun}<b>Stunned</b><span class="dimtx">Skips its next action</span></div>`;
  const m=curMove(),p=[];
  for(const [k,a,b] of m.fx){
    if(k==='atk')p.push(`<span class="ic atk">${ICON.atk}${enemyHit(a)}${b>1?'×'+b:''}</span>`);
    else if(k==='shield')p.push(`<span class="ic sh">${ICON.shield}${a}</span>`);
    else if(k==='rage')p.push(`<span class="ic bf">${ICON.buff}Rage ${a}</span>`);
    else if(k==='heal')p.push(`<span class="ic hl">${ICON.heal}${a}</span>`);
    else if(k==='cloak')p.push(`<span class="ic ck">${ICON.cloak}Cloak</span>`);
    else if(k==='apply')p.push(`<span class="ic db">${ICON.debuff}${cap(a)} ${b}</span>`);
  }
  return `<div class="intent"><span class="ilbl">Next move</span><b>${m.n}</b><span class="ics">${p.join('')}</span></div>`;
}

function act(a,d){
  const r=S.run;
  switch(a){
    case 'tip':toast(d.tip);return;
    case 'how':modal={k:'how'};break;
    case 'close':modal=null;break;
    case 'title':S.screen='title';break;
    case 'menu':if(busy)return;S.resume=S.screen;S.screen='title';break;
    case 'continue':if(!r)return;S.screen=S.resume||'board';S.resume=null;render();resumeCombat();return;
    case 'new':if(r){modal={k:'confirmNew'}}else S.screen='select';break;
    case 'abandon':modal=null;endRun(false);return;
    case 'hunter':newRun(d.id);return;
    case 'node':enterNode(+d.i);return;
    case 'play':playCard(+d.i);return;
    case 'end':endTurn();return;
    case 'deck':modal={k:'pile',w:'deck'};break;
    case 'pile':modal={k:'pile',w:d.w};break;
    case 'take':{const w=S.reward;if(w.taken!=null)return;w.taken=+d.i;addCard(w.cards[w.taken]);break}
    case 'next':afterNode();return;
    case 'buyCard':{const x=S.shop.cards[+d.i];if(x.sold||r.credits<x.price)return;r.credits-=x.price;x.sold=true;addCard(x.id);toast(CARDS[x.id].n+' added to your deck.');break}
    case 'buyGear':{const x=S.shop.gear[+d.i];if(x.sold||r.credits<x.price)return;r.credits-=x.price;x.sold=true;r.gear.push(x.id);toast(GEAR[x.id].n+' equipped.');break}
    case 'buyRemove':if(S.shop.removed||r.credits<70)return;S.pick={mode:'remove',from:'shop'};break;
    case 'buyRepair':if(S.shop.repaired||r.credits<40)return;r.credits-=40;S.shop.repaired=true;healP(20);toast('Hull repaired.');break;
    case 'dockHeal':healP(Math.round(r.maxHp*.3));afterNode();return;
    case 'dockMod':S.pick={mode:'upgrade',from:'dock'};break;
    case 'evt':{const ev=EVENTS.find(e=>e.id===S.event.id),o=ev.o[+d.i];if(!o||(o.ok&&!o.ok()))return;const res=o.f();if(res!=null)S.event.result=res;break}
    case 'cancelPick':S.pick=null;break;
    case 'pickCard':{
      const p=S.pick,i=r.deck.findIndex(c=>c.uid===d.uid);if(!p||i<0)return;
      const nm=CARDS[r.deck[i].id].n+(r.deck[i].up?'+':'');let msg;
      if(p.mode==='remove'){r.deck.splice(i,1);msg=nm+' purged from your deck.'}else{r.deck[i].up=true;msg=nm+' modded to '+CARDS[r.deck[i].id].n+'+.'}
      S.pick=null;
      if(p.from==='shop'){r.credits-=70;S.shop.removed=true;toast(msg)}
      else if(p.from==='event')S.event.result=msg;
      else if(p.from==='dock'){toast(msg);afterNode();return}
      break}
    default:return;
  }
  render();
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;act(t.dataset.a,t.dataset)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(modal||S.pick)){if(S.pick)S.pick=null;else modal=null;render();return}
  if(S.screen!=='combat'||modal||S.pick||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-9]$/.test(e.key))playCard(+e.key-1);
  else if(e.key==='e'||e.key==='E')endTurn();
});

/* ================= BACKDROP ================= */
function stars(){
  const cv=$('#stars'),x=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0a0b27');g.addColorStop(.65,'#131241');g.addColorStop(1,'#2a1a55');x.fillStyle=g;x.fillRect(0,0,w,h);
  let seed=11;const rr=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.floor(w*h/5200);
  for(let i=0;i<n;i++){x.fillStyle=`rgba(246,236,210,${(.2+rr()*.5).toFixed(2)})`;x.beginPath();x.arc(rr()*w,rr()*h,.5+rr()*1.1,0,7);x.fill()}
  const sp=(cx,cy,r,col)=>{x.fillStyle=col;x.beginPath();for(let i=0;i<8;i++){const a=Math.PI/4*i-Math.PI/2,q=i%2?r*.24:r;x.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}x.closePath();x.fill()};
  const m=Math.floor(w*h/52000);
  for(let i=0;i<m;i++)sp(rr()*w,rr()*h,4+rr()*6,rr()<.3?'rgba(248,195,60,.75)':'rgba(246,236,210,.6)');
  /* ringed planet in the lower right, cratered moon in the upper left */
  const R=Math.min(w,h)*.17,px=w-R*.5,py=h-R*.4;
  const ringHalf=(a,b)=>{x.save();x.translate(px,py);x.rotate(-.3);x.strokeStyle='rgba(246,236,210,.22)';x.lineWidth=R*.09;x.beginPath();x.ellipse(0,0,R*1.75,R*.34,0,a,b);x.stroke();x.restore()};
  ringHalf(Math.PI,2*Math.PI);
  x.save();x.beginPath();x.arc(px,py,R,0,7);x.clip();
  x.fillStyle='#3a1f4f';x.fillRect(px-R,py-R,2*R,2*R);
  x.fillStyle='#4a2757';for(let i=-2;i<3;i++)x.fillRect(px-R,py+i*R*.42-R*.08,2*R,R*.17);
  x.fillStyle='rgba(10,9,35,.3)';for(let yy=-R;yy<R;yy+=6)for(let xx=R*.15+((yy/6)%2?3:0);xx<R;xx+=6){x.beginPath();x.arc(px+xx,py+yy,1.6,0,7);x.fill()}
  x.restore();
  ringHalf(0,Math.PI);
  const mr=Math.min(w,h)*.07,mx=mr*1.5,my=mr*1.7;
  x.fillStyle='rgba(246,236,210,.22)';x.beginPath();x.arc(mx,my,mr,0,7);x.fill();
  x.fillStyle='rgba(12,13,43,.3)';[[-.3,-.2,.22],[.3,.25,.16],[.1,-.45,.1]].forEach(c=>{x.beginPath();x.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,7);x.fill()});
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(stars,150)});

/* ================= BOOT ================= */
function start(data){
  if(data&&data.S&&data.S.career){S=data.S}
  else{
    S=load()||fresh();
    if(S.run&&S.screen!=='title'){S.resume=S.screen;S.screen='title'}
    else if(!S.run&&S.screen!=='end')S.screen='title';
  }
  busy=false;modal=null;stars();render();
  if(S.screen==='combat')resumeCombat();
}
window.__vwGallery=on=>{galleryMode=on!==false;render()};
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({S}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
