<title>Intro Title Card</title>

<style>
/* Layout: one fixed 1920×1080 stage scaled to the window, portrait on the left, name and lines on the right. Single dark look on purpose: it is a video frame. */
:root {
  --ground: #0B120F;
  --glow: #17573F;
  --ink: #EEF4F0;
  --muted: #A3B5AB;
  --accent: #6CCF9E;
  --line: rgba(108, 207, 158, 0.35);
  --f-display: "Newsreader", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-ui); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.viewport { position: fixed; inset: 0; display: grid; place-items: center; }
.stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; transform-origin: center; flex: none;
  background:
    radial-gradient(900px 700px at var(--gx, 28%) var(--gy, 50%), rgba(23, 87, 63, .75), transparent 70%),
    radial-gradient(700px 500px at 85% 110%, rgba(23, 87, 63, .35), transparent 70%),
    var(--ground); }
.stage.play { animation: drift 14s ease-in-out infinite alternate; }
@property --gx { syntax: "<percentage>"; inherits: false; initial-value: 28%; }
@property --gy { syntax: "<percentage>"; inherits: false; initial-value: 50%; }
@keyframes drift { from { --gx: 24%; --gy: 46%; } to { --gx: 34%; --gy: 56%; } }

/* faint ruled lines, like a contract page */
.rules { position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 63px, rgba(238,244,240,.035) 63px 64px); opacity: 0; }
.play .rules { animation: fade 1.6s ease .1s forwards; }

.portrait { position: absolute; left: 230px; top: 50%; width: 560px; height: 560px; margin-top: -280px; }
.frame { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; clip-path: circle(0% at 50% 50%); background: #1b2a23; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.14) translate(1.5%, 2%); }
.play .frame { animation: reveal 1.1s cubic-bezier(.2,.8,.2,1) .35s forwards; }
.play .frame img { animation: kenburns 12s ease-out .35s forwards; }
.ring { position: absolute; inset: -26px; border-radius: 50%; border: 2px solid var(--line); opacity: 0; transform: scale(.9); }
.ring.r2 { inset: -58px; border-color: rgba(108,207,158,.14); }
.play .ring { animation: ringIn 1.2s cubic-bezier(.2,.8,.2,1) .7s forwards, breathe 5s ease-in-out 2s infinite; }
.play .ring.r2 { animation: ringIn 1.4s cubic-bezier(.2,.8,.2,1) .9s forwards, breathe 5s ease-in-out 2.4s infinite; }
.arc { position: absolute; inset: -26px; }
.arc circle { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 120 2000; stroke-dashoffset: 120; opacity: 0; }
.play .arc { animation: spin 18s linear 1.2s infinite; }
.play .arc circle { animation: arcIn 1s ease 1.2s forwards; }

.copy { position: absolute; left: 940px; right: 160px; top: 50%; transform: translateY(-50%); display: grid; gap: 26px; }
.eyebrow { font-family: var(--f-mono); font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.name { font-family: var(--f-display); font-weight: 400; font-size: 138px; line-height: .98; letter-spacing: -0.02em; text-wrap: balance; }
.role { font-size: 40px; color: var(--muted); font-weight: 400; }
.rule { height: 2px; background: var(--accent); width: 0; margin-top: 6px; }
.points { display: grid; gap: 16px; margin: 6px 0 0; padding: 0; list-style: none; }
.points li { font-size: 32px; display: grid; grid-template-columns: 34px 1fr; align-items: baseline; color: var(--ink); }
.points li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); transform: translateY(-4px); }

.in { opacity: 0; transform: translateY(28px); }
.play .in { animation: up .9s cubic-bezier(.2,.8,.2,1) forwards; }
.play .eyebrow { animation-delay: 1.1s; }
.play .name { animation-delay: 1.35s; }
.play .role { animation-delay: 1.7s; }
.play .rule { animation: draw 1s cubic-bezier(.6,0,.2,1) 2s forwards; }
.play .points li:nth-child(1) { animation-delay: 2.4s; }
.play .points li:nth-child(2) { animation-delay: 2.65s; }
.play .points li:nth-child(3) { animation-delay: 2.9s; }

[contenteditable="true"] { outline: 2px dashed rgba(108,207,158,.6); outline-offset: 8px; border-radius: 4px; cursor: text; }
.editing .in { opacity: 1 !important; transform: none !important; animation: none !important; }
.editing .rule { width: 180px !important; animation: none !important; }

@keyframes fade { to { opacity: 1; } }
@keyframes reveal { to { clip-path: circle(50% at 50% 50%); } }
@keyframes kenburns { to { transform: scale(1.02) translate(0, 0); } }
@keyframes ringIn { to { opacity: 1; transform: scale(1); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
@keyframes arcIn { to { opacity: 1; stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes up { to { opacity: 1; transform: none; } }
@keyframes draw { to { width: 180px; } }

/* controls, outside the stage, hidden with H */
.controls { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; z-index: 5; transition: opacity .2s; }
.controls button { font: 500 14px var(--f-ui); color: var(--ink); background: rgba(20, 34, 28, .85); border: 1px solid rgba(238,244,240,.18); padding: 8px 14px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(6px); }
.controls button:hover { border-color: var(--accent); }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls button.on { background: var(--accent); color: var(--ground); border-color: var(--accent); }
.controls .hint { font: 13px var(--f-ui); color: var(--muted); align-self: center; padding-right: 4px; }
.hide-ui .controls { opacity: 0; pointer-events: none; }
body.hide-ui { cursor: none; }

@media (prefers-reduced-motion: reduce) {
  .play .frame img, .play .arc, .stage.play, .play .ring { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
}
</style>

      <div class="role in" data-k="role">Lead Solution Engineer</div>
      <div class="rule"></div>

<div class="controls" id="controls">
  <span class="hint">R replay · E edit · H hide</span>
  <button id="b-edit" type="button">Edit text</button>
  <button id="b-replay" type="button">Replay</button>
  <button id="b-hide" type="button">Hide controls</button>
</div>

<script>
const stage = document.getElementById('stage');
const fields = [...document.querySelectorAll('[data-k]')];
const KEY = 'intro-card-text';

// restore text this viewer typed before
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); fields.forEach(f => { if (saved[f.dataset.k]) f.textContent = saved[f.dataset.k]; }); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(fields.map(f => [f.dataset.k, f.textContent.trim()])))); } catch (e) {} }

function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

function replay() {
  if (document.body.classList.contains('editing')) toggleEdit();
  stage.classList.remove('play'); void stage.offsetWidth; stage.classList.add('play');
}
function toggleEdit() {
  const on = !document.body.classList.contains('editing');
  document.body.classList.toggle('editing', on);
  fields.forEach(f => f.contentEditable = on ? 'true' : 'false');
  document.getElementById('b-edit').classList.toggle('on', on);
  document.getElementById('b-edit').textContent = on ? 'Done editing' : 'Edit text';
  if (on) { const n = fields.find(f => f.dataset.k === 'name'); n.focus(); getSelection().selectAllChildren(n); }
  else { save(); replay(); }
}
function toggleHide() { document.body.classList.toggle('hide-ui'); }

document.getElementById('b-replay').onclick = replay;
document.getElementById('b-edit').onclick = toggleEdit;
document.getElementById('b-hide').onclick = toggleHide;
fields.forEach(f => {
  f.addEventListener('input', save);
  f.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); f.blur(); } });
});
addEventListener('keydown', e => {
  if (document.body.classList.contains('editing') && e.target.isContentEditable) { if (e.key === 'Escape') toggleEdit(); return; }
  const k = e.key.toLowerCase();
  if (k === 'r') replay(); else if (k === 'e') toggleEdit(); else if (k === 'h') toggleHide();
});

requestAnimationFrame(() => stage.classList.add('play'));
</script>
